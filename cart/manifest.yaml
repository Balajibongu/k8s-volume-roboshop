apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-configmap
  namespace: roboshop
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: cart
spec: 
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: cart
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: cart
    spec:
      containers:
      - name: cart
        image: balaji1729/cart:v1
        imagePullPolicy: Always
        ports:
        - name: liveness-port
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: cart-configmap 
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 30


---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: roboshop
spec:
  type: ClusterIP
  selector:
      name: roboshop
      env: dev
      running: cart
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080